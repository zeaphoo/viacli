[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Actforce Devs"]
license = "MIT"
repository = "https://github.com/zeaphoo/viacli"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
chrono = "0.4"
log = "0.4"
once_cell = "1"
async-trait = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
