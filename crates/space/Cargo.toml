[package]
name = "space"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "太空采集器：CelesTrak 卫星(TLE+SGP4) + SatNOGS/TinyGS 地面站（遵循 docs/07-collector-protocol.md）"

[[bin]]
name = "viacli-space"
